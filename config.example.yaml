# BetPawa Prematch-to-Live Monitor Configuration

polling:
  live_interval_seconds: 30
  prematch_interval_seconds: 150  # 2.5 minutes
  prematch_lookahead_hours: 3

thresholds:
  grace_period_minutes: 5
  hard_timeout_minutes: 90

betpawa:
  base_url: "https://www.betpawa.ng/api/sportsbook/v3"
  brand: "betpawa-nigeria"
  language: "en"
  device_type: "web"

slack:
  bot_token: ""  # xoxb-... (REQUIRED)
  channel_id: ""  # C... (REQUIRED)
  summary_channel_id: ""  # Optional, defaults to channel_id

database:
  path: "data/events.db"
  retention_days: 30

reporting:
  day: "tuesday"
  time: "08:00"
  week_starts: "tuesday"
  output_dir: "reports/"

markets:
  enabled: true
  snapshot_windows:
    prematch_60_min_before: [60, 55]
    prematch_15_min_before: [15, 10]
    prematch_1_min_before: [1, 0]
  alert_thresholds:
    retention_below_pct: 50
    any_key_market_dropped: true
    max_odds_shift_pct: 30
  key_markets:
    - "1X2 - FT"
    - "Total Score Over/Under - FT"
    - "Both Teams To Score - FT"
    - "Double Chance - FT"
    - "1X2 - 1H"
